<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>图像解码器</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 40px; }
        .container { display: flex; justify-content: center; gap: 40px; }
        .block { border: 1px solid #ccc; padding: 20px; }
        img { max-width: 300px; max-height: 300px; display: block; margin: 10px auto; background: #fff; }
        button { margin-top: 10px; padding: 8px 16px; }
    </style>
</head>
<body>
    <h1>图像解码器</h1>
    <div class="container">
        <div class="block">
            <h3>上传图像</h3>
            <input type="file" id="upload" accept="image/*">
            <!-- 默认显示纯白占位图 -->
            <img id="preview" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8Xw8AAn0B9p1ZfXkAAAAASUVORK5CYII=" alt="预览图">
        </div>
        <div class="block">
            <h3>解码结果</h3>
            <span>解码文件名称：</span>
            <input type="text" id="filename" placeholder="输入下载文件名" value="restored.png">

            <button id="decodeBtn" disabled>解码</button>
            <button id="downloadBtn" disabled>下载</button>

            <!-- 默认显示纯白占位图 -->
            <img id="decoded" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8Xw8AAn0B9p1ZfXkAAAAASUVORK5CYII=" alt="解码图">
        </div>
    </div>

    <script>
        const uploadInput = document.getElementById('upload');
        const previewImg = document.getElementById('preview');
        const decodeBtn = document.getElementById('decodeBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const decodedImg = document.getElementById('decoded');

        let uploadedFile = null;
        let decodedUrl = null;

        // 上传预览
        uploadInput.addEventListener('change', () => {
            const file = uploadInput.files[0];
            if (file) {
                uploadedFile = file;
                previewImg.src = URL.createObjectURL(file);
                decodeBtn.disabled = false;
                downloadBtn.disabled = true;
                decodedImg.src = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8Xw8AAn0B9p1ZfXkAAAAASUVORK5CYII=";
            }
            // 关键：重置 input 的值
            uploadInput.value = "";
        });

        // 解码按钮
        decodeBtn.addEventListener('click', async () => {
            if (!uploadedFile) return;

            const formData = new FormData();
            formData.append("image", uploadedFile);

            decodeBtn.textContent = "解码中...";
            decodeBtn.disabled = true;

            const response = await fetch("/decode", {
                method: "POST",
                body: formData
            });

            const blob = await response.blob();
            decodedUrl = URL.createObjectURL(blob);
            decodedImg.src = decodedUrl;

            decodeBtn.textContent = "解码";
            decodeBtn.disabled = false;
            downloadBtn.disabled = false; // 解码完成后启用下载按钮
        });

        // 下载按钮
        downloadBtn.addEventListener('click', () => {
            if (!decodedUrl) return;
            const filenameInput = document.getElementById('filename');
            let filename = filenameInput.value.trim();
            if (!filename) filename = "restored.png"; // 默认值
            const a = document.createElement("a");
            a.href = decodedUrl;
            a.download = filename;
            a.click();
        });

    </script>
</body>
</html>
