syntax = "proto3";

package wuk.net;

// 消息类型标志位（Bit map）
enum MessageType {
  NONE    = 0x00000000; // ........ ........ ........ ........ 无标志位（默认情况）
  FILE    = 0x00000001; // ........ ........ ........ .......1 文件
  DATA    = 0x00000002; // ........ ........ ........ ......1. 一般数据
  SEGMENT = 0x00000004; // ........ ........ ........ .....1.. 已分段
  OVER    = 0x00000008; // ........ ........ ........ ....1... 已是分段包的最后一个
  XCRYPT  = 0x00000010; // ........ ........ ........ ...1.... 已加密
  MESSAGE = 0x00000020; // ........ ........ ........ ..1..... 纯消息
  URGENT  = 0x00000040; // ........ ........ ........ .1...... 紧急包
  IMAGE   = 0x00000080; // ........ ........ ........ 1....... 图像且FILE，否则视为表情包
  VIDEO   = 0x00000100; // ........ ........ .......1 ........ 视频
  AUDIO   = 0x00000200; // ........ ........ ......1. ........ 音频
  ANYM    = 0x00000400; // ........ ........ .....1.. ........ 匿名包
}

// 主消息结构
message Message {
  // 头部字段
  MessageType msg_type     = 1; // 消息类型标志位
  uint32      msg_seq      = 2; // 序列号
  uint32      seg_id       = 3; // 分段包ID（未分段时必须始终为0）
  uint32      proto_ver    = 4; // 协议版本号

  // 参与者
  uint64      sender_id    = 5; // 发送方ID（最高位可标记群聊）
  uint64      recipient_id = 6; // 接收方ID

  // 元数据
  double      time_stamp   = 7; // UNIX时间戳

  // 消息标识
  uint32      msg_size     = 8; // 消息体长度
  uint32      msg_id       = 9; // 消息唯一ID

  // 消息体
  bytes       message      = 10; // 二进制消息体（对应原wuk::Buffer）
}

/*
 * 0.  对于校验，必须使用 **Protobuf** 将内容全部打包后输出为二进制序列后直接计算整个二进制序列的校验值（不可分开数据计算）。
 * 1.  `proto_ver`最低必须是 **0x01** （即0.1版本）。
 * 2.  当未实行包分段传输时，`seg_id`的值应始终为 **0** 。
 * 2.  `sender_id`即使在`message_type`为`ANYM`的情况下，也必须是准确的用户ID，不能匿名；
       当然在用户端可显示为匿名，需保留追踪到用户的能力。
 * 3.  `recipient_id`的第一个二进制位为1时，代表群组聊天，为0时代表一对一的私聊（后续考虑增加bool类型用于表示不同的聊天）。
 * 4.  `time_stamp`必须是UNIX时间戳，且格式必须是浮点数，如`1728856869.7596`。
 * 5.  `msg_id`可由用户定义，或得到整个包的CRC32校验值（在用户未直接定义此值时）。
*/
